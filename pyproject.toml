[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mathscanbench"
version = "0.1.0"
description = "A framework for testing how language models solve and check maths and mechanics problems, typed, scanned or handwritten, and where they are confidently wrong."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Vladimir Bratov", email = "vladimir@bratov.com" }]
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "sympy>=1.12",
  "pint>=0.23",
  "pillow>=10.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
dev = ["pytest>=8.0"]

[project.scripts]
mathscanbench = "mathscanbench.cli:main"

[tool.setuptools.packages.find]
include = ["mathscanbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
